<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="title desc">
  <title id="title">Scrapanium — HTTP and WebSockets for Bend2</title>
  <desc id="desc">Bend2 connects through Scrapanium's native transport to browser TLS, HTTP and WebSockets.</desc>
