    <text x="39" y="162" font-size="28" font-weight="450">HTTP &amp; WebSockets for Bend2.</text>
  </g>
  <g transform="translate(506 38) scale(.56)" fill="none" stroke="#e98649" stroke-width="21" stroke-linecap="round" stroke-linejoin="round">
