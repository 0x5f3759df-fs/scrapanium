name: test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Install compiler and build dependencies
        run: apt-get update && apt-get install -y clang git nodejs npm python3 python3-venv python3-dev libffi-dev ca-certificates time
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: benchmarks/tls-client/go.sum
      - run: clang --version && python3 --version && go version
      - run: python3 scripts/bootstrap.py --matched
      - run: python3 scripts/build.py
      - run: .deps/venv-matched/bin/pytest -q tests --junitxml=build/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/results.xml
